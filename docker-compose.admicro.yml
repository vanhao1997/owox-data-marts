services:
  admicro-extractor:
    profiles: [admicro]
    build:
      context: ./apps/admicro-extractor
    environment:
      NODE_ENV: production
      PORT: 8091
      ADMICRO_EXTRACTOR_ENABLED: 'true'
      ADMICRO_EXTRACTOR_SHARED_SECRET: ${ADMICRO_EXTRACTOR_SHARED_SECRET:?Set ADMICRO_EXTRACTOR_SHARED_SECRET}
      ADMICRO_EXTRACTOR_MAX_CONCURRENCY: ${ADMICRO_EXTRACTOR_MAX_CONCURRENCY:-2}
    expose:
      - '8091'
    ports:
      - '127.0.0.1:8091:8091'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8091/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - owox-private

networks:
  owox-private:
    name: owox-private
